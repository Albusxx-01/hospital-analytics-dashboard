[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hospital-intelligence"
version = "1.0.0"
description = "Reproducible hospital operations analytics, forecasting and capacity simulation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dash>=3.0,<4",
  "plotly>=6.0,<7",
  "pandas>=2.2,<3",
  "numpy>=2.0,<2.4",
  "pyarrow>=19,<24",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
tableau = ["tableauhyperapi>=0.0.22000"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15", "pandas-stubs>=2.2,<3"]

[project.scripts]
hospital = "hospital_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:dash"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

